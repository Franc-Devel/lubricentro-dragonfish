<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Control Central | Dragonfish LC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-dark text-white">
    <nav
      class="navbar navbar-dark bg-black px-3 border-bottom border-secondary py-1"
    >
      <span class="navbar-brand fw-bold text-info small"
        >DRAGONFISH LC v1.0</span
      >
      <div>
        <span class="small text-muted me-3" id="operator-display">Admin</span>
        <button class="btn btn-outline-danger btn-sm py-0" id="btn-logout">
          Salir
        </button>
      </div>
    </nav>

    <div class="d-flex">
      <div
        class="bg-black border-end border-secondary p-2"
        style="width: 220px; height: calc(100vh - 35px)"
      >
        <div class="nav flex-column nav-pills gap-1">
          <button
            class="nav-link active text-start small fw-bold"
            id="tab-ventas"
            data-bs-toggle="pill"
            data-bs-target="#panel-ventas"
          >
            Terminal Ventas
          </button>
          <button
            class="nav-link text-start small fw-bold"
            id="tab-productos"
            data-bs-toggle="pill"
            data-bs-target="#panel-productos"
            onclick="cargarProductosMaestro()"
          >
            Stock & Catálogo
          </button>
        </div>
      </div>

      <div class="tab-content p-3 flex-grow-1">
        <div class="tab-pane fade show active" id="panel-ventas">
          <h5 class="text-info fw-bold mb-3">NUEVA OPERACIÓN DE VENTA</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <div class="card bg-secondary p-3 border-0">
                <form id="form-add-venta">
                  <div class="mb-2">
                    <label class="small text-info fw-bold mb-1"
                      >🔍 BUSCADOR RÁPIDO (Cód / Nombre)</label
                    >
                    <input
                      type="text"
                      id="input-filtrar-venta"
                      class="form-control bg-dark text-white border-secondary form-control-sm mb-2"
                      placeholder="Escribí código o descripción..."
                    />
                  </div>
                  <div class="mb-2">
                    <label class="small text-muted fw-bold"
                      >Artículo Seleccionado</label
                    >
                    <select
                      id="venta-producto-select"
                      class="form-select bg-dark text-white border-0"
                      required
                    ></select>
                  </div>
                  <div class="mb-3">
                    <label class="small text-muted fw-bold">Cantidad</label>
                    <input
                      type="number"
                      id="venta-cantidad"
                      class="form-control bg-dark text-white border-0"
                      value="1"
                      min="1"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    class="btn btn-info w-100 text-dark fw-bold"
                  >
                    AGREGAR
                  </button>
                </form>
              </div>
            </div>

            <div class="col-md-8">
              <div class="card bg-secondary p-3 border-0">
                <table class="table table-dark table-striped small">
                  <thead>
                    <tr>
                      <th>Cod.</th>
                      <th>Detalle</th>
                      <th class="text-center">Cant</th>
                      <th class="text-end">Subtotal</th>
                      <th class="text-center"></th>
                    </tr>
                  </thead>
                  <tbody id="ticket-items">
                    <tr>
                      <td colspan="5" class="text-center text-muted py-3">
                        Terminal lista. Ingrese artículos.
                      </td>
                    </tr>
                  </tbody>
                </table>
                <div
                  class="d-flex justify-content-between align-items-center mt-3"
                >
                  <h4 class="m-0">
                    Total:
                    <span class="text-info" id="ticket-total">$0.00</span>
                  </h4>
                  <button
                    class="btn btn-success text-dark fw-bold"
                    id="btn-finalizar"
                    disabled
                  >
                    COBRAR
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="panel-productos">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-info fw-bold m-0">MAESTRO DE ARTÍCULOS</h5>
            <div class="d-flex gap-2">
              <input
                type="text"
                id="input-buscar-prod"
                class="form-control bg-dark text-white border-secondary form-control-sm"
                placeholder="Buscar por código, nombre, marca..."
                style="width: 280px"
              />
              <button
                class="btn btn-info btn-sm text-dark fw-bold px-3"
                onclick="cargarProductosMaestro()"
              >
                FILTRAR
              </button>
            </div>
          </div>
          <div class="card bg-secondary p-3 border-0">
            <table class="table table-dark table-striped table-hover small">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Descripción</th>
                  <th>Medida</th>
                  <th class="text-end">Precio</th>
                  <th class="text-center">Stock</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-productos-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sistema.js"></script>
  </body>
</html>
